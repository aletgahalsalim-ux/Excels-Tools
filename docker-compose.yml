services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: afdip
      POSTGRES_PASSWORD: afdip_dev
      POSTGRES_DB: afdip
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U afdip']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: afdip
      MINIO_ROOT_PASSWORD: afdip_dev_secret
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - miniodata:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 3s
      retries: 10

  excel-analyzer:
    build: ./services/excel-analyzer
    ports:
      - '8100:8100'
    environment:
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: afdip
      S3_SECRET_KEY: afdip_dev_secret
      S3_BUCKET: afdip-files
    depends_on:
      - minio

volumes:
  pgdata:
  miniodata:
