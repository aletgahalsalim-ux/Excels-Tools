[project]
name = "excel-analyzer"
version = "0.1.0"
description = "Excel Analysis Engine — deterministic structure/table/formula analysis for the AI Financial Document Intelligence Platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "openpyxl>=3.1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "jsonschema>=4.22",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
