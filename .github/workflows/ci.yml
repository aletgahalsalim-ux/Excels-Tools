name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  node:
    name: Build + Jest (shared, api, web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:generate -w apps/api
      - run: npm run build
      - run: npm test -w apps/api

  python:
    name: pytest (excel-analyzer)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/excel-analyzer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q

  e2e:
    name: End-to-end smoke
    runs-on: ubuntu-latest
    needs: [node, python]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: afdip
          POSTGRES_PASSWORD: afdip_dev
          POSTGRES_DB: afdip
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U afdip"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://afdip:afdip_dev@localhost:5432/afdip
      REDIS_URL: redis://localhost:6379
      EXCEL_ANALYZER_URL: http://localhost:8100
      STORAGE_DRIVER: local
      STORAGE_LOCAL_PATH: /tmp/afdip-storage
      AI_PROVIDER: mock
      JWT_SECRET: ci-secret
      API_PORT: '3001'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: npm ci
      - run: npm run db:generate -w apps/api
      - run: npm run build -w packages/shared && npm run build -w apps/api
      - run: npm run db:migrate -w apps/api
      - run: npm run db:seed -w apps/api

      - name: Start excel-analyzer
        working-directory: services/excel-analyzer
        run: |
          pip install -e .
          nohup python -m uvicorn app.main:app --port 8100 > /tmp/analyzer.log 2>&1 &

      - name: Start API
        working-directory: apps/api
        run: nohup node dist/main.js > /tmp/api.log 2>&1 &

      - name: Wait for services
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8100/health >/dev/null 2>&1 \
              && curl -sf http://localhost:3001/api/v1/health >/dev/null 2>&1 \
              && break
            sleep 2
          done
          curl -sf http://localhost:8100/health
          curl -sf http://localhost:3001/api/v1/health

      - name: Run e2e smoke
        run: PYTHON=python ./scripts/e2e-smoke.sh

      - name: Print service logs on failure
        if: failure()
        run: |
          echo '=== analyzer ==='; cat /tmp/analyzer.log || true
          echo '=== api ==='; cat /tmp/api.log || true
